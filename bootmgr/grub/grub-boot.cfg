function set_kernel_cmdline_dynamic_device_specific {
	set kernel_cmdline_dynamic_device_specific=

	# Video mode for the kernel, which the firmware framebuffer (simpledrm, for GPUs without
	# a driver) keeps: the resolution chosen in Settings (pc_display_mode, saved by
	# init.pc.rc), else "auto", the monitor's preferred mode. The firmware's own mode list
	# applies, so GRUB falls back to auto when it doesn't have the chosen one.
	load_env -f ${partition_persist}/grubenv pc_display_mode
	if [ -n "$pc_display_mode" ]; then
		if [ "$pc_display_mode" != "auto" ]; then
			set gfxpayload="${pc_display_mode};auto"
		else
			set gfxpayload=auto
		fi
	else
		set gfxpayload=auto
	fi
}

submenu 'Advanced options (pc_x86_64 specific)' --class format-list-bulleted --id advancedoptions-pc_x86_64 {
	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Intel pre-Skylake GPU with workarounds)" --id android-pc_x86_64-intelpreskylakewithworkarounds {
		set_android_default "advancedoptions-pc_x86_64>android-pc_x86_64-intelpreskylakewithworkarounds"
		boot_android androidboot.gpu=intel androidboot.gpu_workaround=all androidboot.hardware_vulkan=intel_hasvk
	}
	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Software rendering)" --id android-pc_x86_64-swiftshader {
		set_android_default "advancedoptions-pc_x86_64>android-pc_x86_64-swiftshader"
		boot_android androidboot.graphics=swiftshader
	}
}
